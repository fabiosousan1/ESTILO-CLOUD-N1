<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESTILO CLOUD N1</title><style>body{font:16px Arial;background:#171717;color:white;max-width:850px;margin:40px auto;padding:20px}h1{color:#B5E66B}input,button{padding:12px;border-radius:8px;margin:5px}input{width:65%}button{background:#F28C28;border:0;cursor:pointer}li{margin:14px 0}a{color:#B5E66B}</style><h1>ESTILO CLOUD N1</h1><p>Organize suas referencias e exporte para o Baixador N1.</p><form id="f"><input id="url" type="url" placeholder="Cole o link do Pinterest" required><button>Adicionar</button></form><button id="export">Exportar TXT</button><button id="copy">Copiar para Google Docs</button><ul id="list"></ul><script>let links=JSON.parse(localStorage.getItem('n1-links')||'[]');function render(){document.getElementById('list').replaceChildren();links.forEach((url,i)=>{let li=document.createElement('li'),a=document.createElement('a'),b=document.createElement('button');a.href=url;a.target='_blank';a.rel='noopener';a.textContent=url;b.textContent='Excluir';b.onclick=()=>{links.splice(i,1);save()};li.append(a,b);document.getElementById('list').append(li)})}function save(){localStorage.setItem('n1-links',JSON.stringify(links));render()}document.getElementById('f').onsubmit=e=>{e.preventDefault();let u=document.getElementById('url').value.trim();if(!links.includes(u))links.push(u);save();e.target.reset()};document.getElementById('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([links.join('\n')],{type:'text/plain'}));a.href=u;a.download='links_pinterest.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(links.join('\n')).then(()=>alert('Copiado! Cole no Google Docs.'));render()</script></html>
